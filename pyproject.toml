[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long SQL strings and HTML

[tool.ruff.lint.isort]
known-first-party = ["aggregator", "app", "collector", "configure", "eg4", "init_db", "migrate_v3", "settings", "timeutil", "tests"]
